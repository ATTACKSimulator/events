<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Refund Center — Claim your refund</title>
	<style>
		* { box-sizing: border-box; margin: 0; }
		body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #eef4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
		.banner { width: 100%; background: #b06000; color: #fff; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; }
		.card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); width: 420px; max-width: 92vw; padding: 36px; margin-top: 50px; }
		.amount { font-size: 32px; font-weight: 800; color: #1b7a3d; margin-bottom: 4px; }
		p.note { color: #555; font-size: 14px; margin-bottom: 22px; }
		label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
		input { width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #ccd4dc; border-radius: 6px; font-size: 15px; }
		.row { display: flex; gap: 12px; }
		button { width: 100%; background: #1b7a3d; color: #fff; border: none; border-radius: 6px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
	</style>
</head>
<body>
	<div class="banner">Your refund expires today — claim it immediately.</div>
	<div class="card">
		<div class="amount">$128.40</div>
		<p class="note">A refund is pending on your account. Enter your card details to receive the payment.</p>
		<form>
			<label>Cardholder name</label>
			<input type="text" name="cardholder" autocomplete="cc-name" placeholder="Full name" />
			<label>Card number</label>
			<input type="text" name="cardnumber" autocomplete="cc-number" inputmode="numeric" placeholder="1234 5678 9012 3456" />
			<div class="row">
				<div style="flex:1">
					<label>Expiry date</label>
					<input type="text" name="cc-exp" autocomplete="cc-exp" placeholder="MM/YY" />
				</div>
				<div style="flex:1">
					<label>CVC</label>
					<input type="text" name="cvc" autocomplete="cc-csc" inputmode="numeric" placeholder="123" />
				</div>
			</div>
			<button type="submit">Claim refund now</button>
		</form>
	</div>
	<script src="../../dist/bundle.js"></script>
	<script src="setup.js"></script>
</body>
</html>
