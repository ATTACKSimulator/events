<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Congratulations — You've been selected!</title>
	<style>
		* { box-sizing: border-box; margin: 0; }
		body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: linear-gradient(135deg, #5b2be0, #a72bd6); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
		.card { background: #fff; border-radius: 16px; width: 460px; max-width: 92vw; padding: 46px 40px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
		.gift { font-size: 60px; margin-bottom: 12px; }
		h1 { font-size: 26px; margin-bottom: 10px; }
		p { color: #5a6270; font-size: 15px; margin-bottom: 28px; }
		button { background: #ff9500; color: #fff; border: none; border-radius: 999px; padding: 16px 40px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px rgba(255,149,0,.4); }
	</style>
</head>
<body>
	<div class="card">
		<div class="gift">🎁</div>
		<h1>You've won an iPhone 17 Pro!</h1>
		<p>You are today's lucky visitor. Claim your prize right now — this offer is only valid for the next 10 minutes.</p>
		<button type="button">Claim my prize</button>
	</div>
	<script src="../../dist/bundle.js"></script>
	<script src="setup.js"></script>
</body>
</html>
